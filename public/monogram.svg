    <use href="#right" transform="translate(-1 -6)" stroke="#ffe6c1" opacity=".37" stroke-width="5" filter="url(#soft)"/>
    <use href="#left" stroke="#c45c41" stroke-width="30" transform="translate(0 1.3)"/>
