<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" role="img" aria-label="Go Winks intertwined emblem">
  <defs>
    <linearGradient id="back" x1="0" x2=".97" y1="0" y2=".76" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffca85"/><stop offset=".35" stop-color="#ed754d"/><stop offset=".7" stop-color="#ff8d85"/><stop offset="1" stop-color="#ee424e"/>
    </linearGradient>
    <linearGradient id="front" x1="0" x2="1" y1=".25" y2=".56">
      <stop stop-color="#ffd98d"/><stop offset=".35" stop-color="#ffba71"/><stop offset=".63" stop-color="#ff8a69"/><stop offset="1" stop-color="#ff545e"/>
    </linearGradient>
    <radialGradient id="gold" cx=".38" cy=".24" r=".8"><stop stop-color="#fff8b9"/><stop offset=".45" stop-color="#ffdb7b"/><stop offset="1" stop-color="#f18a44"/></radialGradient>
    <radialGradient id="rose" cx=".4" cy=".23" r=".82"><stop stop-color="#ffb9b1"/><stop offset=".5" stop-color="#ff756e"/><stop offset="1" stop-color="#ed3541"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
